name: Guards

# Runs the test suites for the security guards themselves (issue #7), so the
# secret-scan pre-commit hook and the hallucinated-dependency checker cannot
# drift. These are the workflow repo's own guard tests; downstream projects run
# the guards (not these tests) via the bootstrapped CI step.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executable-bit assertion
        # Root cause this guards against: new scripts land at 100644, and git
        # SILENTLY IGNORES a non-executable hook — the pre-commit guard shipped
        # inert until we caught it. Keyed on the SHEBANG, not the .sh suffix,
        # because git hooks are conventionally extensionless (hooks/git/pre-commit,
        # and future pre-push/commit-msg) — a *.sh-only rule would miss exactly
        # the file that caused the bug. *.mjs is excluded: node-invoked, correctly 100644.
        run: |
          fail=0
          while IFS=$'\t' read -r meta path; do
            mode="${meta%% *}"
            case "$path" in *.mjs) continue ;; esac
            [ -f "$path" ] || continue
            # Union of two rules so neither can be evaded: any *.sh, OR any file
            # with a shebang (which catches extensionless git hooks like
            # hooks/git/pre-commit — the file that actually caused the bug).
            case "$path" in
              *.sh) ;;
              *) head -c 2 "$path" | grep -q '#!' || continue ;;
            esac
            if [ "$mode" != "100755" ]; then
              echo "FAIL: $path is $mode, expected 100755 (has a shebang; git will not execute it)"
              fail=1
            fi
          done < <(git ls-files -s -- hooks scripts)
          if [ "$fail" -eq 0 ]; then echo "All shebang scripts under hooks/ and scripts/ are executable."; fi
          exit $fail

      - name: Engineering-standards SSOT guard (#6)
        # Promoted from weekly-only: this is a repo-structure invariant, so it
        # belongs in non-bypassable CI on every push/PR, not on a weekly cadence.
        run: bash scripts/check-standards-ssot.sh

      - name: Secret-scan pre-commit guard tests (slice-1)
        run: bash hooks/git/pre-commit.test.sh

      - name: Hallucinated-dependency checker tests (slice-2)
        run: node scripts/check-imports.test.mjs
